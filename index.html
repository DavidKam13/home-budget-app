<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحباً بك في بيتي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="onboarding.css">
</head>
<body>

    <div class="onboarding-card theme-blue" id="mainContainer">
        
        <!-- Slide 1 -->
        <div class="slide active" id="slide1">
            <div class="slide-image-container">
                <img src="slide1.jpeg" alt="تحكم في مصاريف بيتك" class="slide-img">
            </div>
            <div class="slide-content">
                <h3>تحكم في مصاريف بيتك</h3>
                <p>سجل دخلك ومصاريفك، تابع رصيدك، واعرف فلوسك بتروح فين.</p>
            </div>
        </div>

        <!-- Slide 2 -->
        <div class="slide" id="slide2">
            <div class="slide-image-container">
                <img src="slide2.jpeg" alt="سجل مصاريفك" class="slide-img">
            </div>
            <div class="slide-content">
                <h3>سجل مصاريفك</h3>
                <p>صنف مصاريفك حسب الفئات المختلفة وكن دائماً على اطلاع.</p>
            </div>
        </div>

        <!-- Slide 3 -->
        <div class="slide" id="slide3">
            <div class="slide-image-container">
                <img src="slide3.jpeg" alt="تابع رصيدك بسهولة" class="slide-img">
            </div>
            <div class="slide-content">
                <h3>تابع رصيدك بسهولة</h3>
                <p>اعرف رصيدك المتبقي في أي وقت وتابع تقدمك نحو أهدافك.</p>
            </div>
        </div>

        <!-- Controls Footer -->
        <div class="controls-footer">
            <button class="btn-text" id="skipOrBackBtn" onclick="handleBackOrSkip()">تخطي</button>
            
            <div class="dots-indicator">
                <span class="dot active" onclick="goToSlide(1)"></span>
                <span class="dot" onclick="goToSlide(2)"></span>
                <span class="dot" onclick="goToSlide(3)"></span>
            </div>

            <button class="btn-action" id="nextBtn" onclick="nextSlide()">
                <span>Next</span> <i class="fa-solid fa-chevron-left"></i>
            </button>
        </div>
    </div>

    <!-- Global Footer -->
    <div class="global-footer">
        <i class="fa-solid fa-lock"></i> بياناتك آمنة ومحفوظة لدينا
    </div>

    <script src="onboarding.js"></script>
</body>
</html>
